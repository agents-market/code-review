# Smoke-test pipeline for dogfooding agents-market/pipeline-action@v1.
# Independent of marketplace skills (which are R12.2-R12.4 stubs).
# Used by .github/workflows/security-review.yml to verify the
# published action runs end-to-end against this public repo.

name: code-review-smoke
version: 1.0.0
defaults:
  model: MiniMax-M3

stages:
  - id: summarize
    prompt: |
      Summarize the PR diff in 3 bullet points.
      Diff: ${DIFF:-<no diff provided>}
    input:
      title: "${PR_TITLE:-<no title>}"
    output_format: text
