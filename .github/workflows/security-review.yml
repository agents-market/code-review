name: Pipeline security review (consumer)

description: >-
  Dogfooding agents-market/pipeline-action@v1 on this public repo.
  Validates the published action runs end-to-end against a real
  consumer (not just the dev repo). Uses mock mode so no API cost.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: Run pipeline-action@v1 on PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: agents-market/pipeline-action@v1
        with:
          mock: 'true'
          pipeline_file: .github/pipelines/code-review-smoke.yaml
        env:
          # Stub values to avoid YAML-breaking chars (colons in PR titles,
          # newlines in PR body). ${VAR} substitution inlines raw values
          # into the pipeline YAML, so ':' or '\n' corrupt the parsed spec.
          # Phase 1.1 will wire real PR content via inputs_json +
          # spec.inputs.PR_TITLE (which doesn't break YAML).
          PR_TITLE: "Test PR title"
          DIFF: "Test diff content"

      - name: Inspect pipeline outputs
        if: always()
        env:
          RESULT_JSON: ${{ steps.pipeline.outputs.result_json }}
          TOTAL_MS: ${{ steps.pipeline.outputs.total_ms }}
          TOTAL_COST: ${{ steps.pipeline.outputs.total_cost_usdc }}
        run: |
          echo "::notice::Pipeline finished in ${TOTAL_MS}ms, cost ~$${TOTAL_COST} USDC"
          echo "$RESULT_JSON" | jq . || echo "(no result_json)"
