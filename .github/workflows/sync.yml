# agents-market/code-review — sync workflow
#
# Dual-trigger:
#   1. schedule (every 15 min) — pull-based auto-sync, no PAT required
#   2. repository_dispatch type=code-review-sync — instant push (future, requires PAT in main)
#
# Source of truth: agents-market/main/examples/pipelines/code-review-vulnerability-detection.yaml
# This repo mirrors it as .pipeline.yaml + bumps patch version on each change.

name: sync

on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [code-review-sync]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: clone source (agents-market/main, public, no auth)
        run: |
          set -euo pipefail
          git clone --depth=1 --no-tags --single-branch https://github.com/agents-market/main.git _source
          cd _source
          git log -1 --oneline

      - name: read source yaml
        run: |
          set -euo pipefail
          SRC=_source/examples/pipelines/code-review-vulnerability-detection.yaml
          if [ ! -f "$SRC" ]; then
            echo "::error::source not found at $SRC"
            ls -la _source/examples/pipelines/ || true
            exit 1
          fi
          cp "$SRC" /tmp/source.yaml
          echo "fetched $(wc -c < /tmp/source.yaml) bytes"
          head -8 /tmp/source.yaml

      - name: compare with current
        id: diff
        run: |
          set -euo pipefail
          if cmp -s /tmp/source.yaml .pipeline.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "content identical, skipping"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "content differs, will sync"
          fi

      - name: verify yaml parses
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 -c "
          import yaml
          with open('/tmp/source.yaml') as f: doc = yaml.safe_load(f)
          assert 'name' in doc, 'name required'
          assert 'stages' in doc and len(doc['stages']) > 0, 'stages required'
          assert 'version' in doc, 'version required'
          print(f\"source: name={doc['name']} version={doc['version']} stages={len(doc['stages'])}\")
          "

      - name: bump version
        if: steps.diff.outputs.changed == 'true'
        env:
          PATCH_BUMP: ${{ github.event.client_payload.patch_bump || 'true' }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^version:' /tmp/source.yaml | head -1 | awk '{print $2}' | tr -d '"'"'"')
          echo "source version: $CURRENT"
          if [ "$PATCH_BUMP" = "false" ]; then
            NEW_VERSION="$CURRENT"
          else
            NEW_VERSION=$(echo "$CURRENT" | awk -F. '{$NF=$NF+1; print}' OFS=.)
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
          sed "s/^version: .*/version: $NEW_VERSION/" /tmp/source.yaml > .pipeline.yaml

      - name: commit + tag + push
        if: steps.diff.outputs.changed == 'true'
        env:
          SOURCE_SHA: ${{ github.event.client_payload.commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "agentsmarket-sync-bot"
          git config user.email "bot@agentsmarket.world"
          git add .pipeline.yaml
          MSG="sync from agents-market/main"
          if [ -n "$SOURCE_SHA" ]; then
            MSG="$MSG @ $SOURCE_SHA"
          fi
          MSG="$MSG (auto v$NEW_VERSION)"
          git commit -m "$MSG"
          git push origin main
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
          echo "synced + tagged v$NEW_VERSION"
