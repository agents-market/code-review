# agents-market/code-review — incoming sync workflow
#
# Triggered by repository_dispatch event type=code-review-sync from agents-market/main.
#
# Source of truth: agents-market/main/examples/pipelines/code-review-vulnerability-detection.yaml
# This repo mirrors it as .pipeline.yaml + bumps patch version on each change.
#
# The push model: main repo's GITHUB_TOKEN dispatches the event; this repo receives it
# without any extra auth (public receiver, same org).

name: sync

on:
  repository_dispatch:
    types: [code-review-sync]
  workflow_dispatch:  # manual override; reads via gh CLI which uses runner's auth

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout this repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: resolve source (from dispatch payload OR manual read)
        id: resolve
        env:
          PAYLOAD_B64: ${{ github.event.client_payload.content_base64 }}
          PAYLOAD_URL: ${{ github.event.client_payload.source_url }}
        run: |
          set -euo pipefail
          if [ -n "$PAYLOAD_B64" ]; then
            echo "source=dispatch_payload" >> $GITHUB_OUTPUT
            echo "$PAYLOAD_B64" | base64 -d > /tmp/source.yaml
          elif [ -n "$PAYLOAD_URL" ]; then
            echo "source=url" >> $GITHUB_OUTPUT
            HTTP_CODE=$(curl -sS -o /tmp/source.yaml -w "%{http_code}" "$PAYLOAD_URL")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "::error::fetch failed with HTTP $HTTP_CODE"
              cat /tmp/source.yaml || true
              exit 1
            fi
          else
            echo "::error::dispatch had no content_base64 or source_url"
            exit 1
          fi
          echo "fetched $(wc -c < /tmp/source.yaml) bytes"
          head -8 /tmp/source.yaml

      - name: compare with current
        id: diff
        run: |
          set -euo pipefail
          if cmp -s /tmp/source.yaml .pipeline.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "content identical, skipping"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "content differs, will sync"
          fi

      - name: verify yaml parses
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 -c "
          import yaml
          with open('/tmp/source.yaml') as f: doc = yaml.safe_load(f)
          assert 'name' in doc, 'name required'
          assert 'stages' in doc and len(doc['stages']) > 0, 'stages required'
          assert 'version' in doc, 'version required'
          print(f\"source: name={doc['name']} version={doc['version']} stages={len(doc['stages'])}\")
          "

      - name: bump version
        if: steps.diff.outputs.changed == 'true'
        env:
          PATCH_BUMP: ${{ github.event.client_payload.patch_bump || 'true' }}
        run: |
          set -euo pipefail
          # extract version, tolerating single or double quotes
          NEW_VERSION=$(grep -E '^version:' /tmp/source.yaml | head -1 | sed -E "s/^version:[[:space:]]*['\"]?([0-9.]+)['\"]?[[:space:]]*$/\1/")
          echo "source version: $NEW_VERSION"
          if [ "$PATCH_BUMP" != "false" ]; then
            NEW_VERSION=$(echo "$NEW_VERSION" | awk -F. '{$NF=$NF+1; print}' OFS=.)
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
          sed "s/^version: .*/version: $NEW_VERSION/" /tmp/source.yaml > .pipeline.yaml

      - name: commit + tag + push
        if: steps.diff.outputs.changed == 'true'
        env:
          # new_version (lowercase) matches the env key written in 'bump version' step.
          # GitHub Actions preserves case in env keys — bash is case-sensitive.
          NEW_VERSION: ${{ env.new_version }}
          SOURCE_SHA: ${{ github.event.client_payload.commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "agentsmarket-sync-bot"
          git config user.email "bot@agentsmarket.world"
          git add .pipeline.yaml
          MSG="sync from agents-market/main"
          if [ -n "$SOURCE_SHA" ]; then
            MSG="$MSG @ $SOURCE_SHA"
          fi
          MSG="$MSG (auto v$NEW_VERSION)"
          git commit -m "$MSG"
          git push origin main
          git tag -a "v${NEW_VERSION}" -m "v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
          echo "synced + tagged v$NEW_VERSION"
